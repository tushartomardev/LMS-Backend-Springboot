spring.application.name=Library-Management-System

# Render provides PORT
server.port=${PORT:8080}

# =========================
# DATABASE
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=${DRIVER_CLASS_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# FRONTEND
# =========================
app.frontend.url=${FRONTEND_URL}

app.frontend.reset-url=${FRONTEND_URL}/auth/reset-password?token=

# =========================
# RAZORPAY
# =========================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.callback.base-url=${FRONTEND_URL}

# =========================
# STRIPE
# =========================
stripe.api.key=${STRIPE_API_KEY}

# =========================
# EMAIL
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

library.notification.from=${MAIL_USERNAME}
library.notification.enabled=true
library.notification.due-reminder-days=3

# =========================
# GEMINI
# =========================
gemini.api.key=${GEMINI_API_KEY}

# =========================
# SUBSCRIPTION
# =========================
subscription.default.plan=MONTHLY
subscription.auto.renew.enabled=false
subscription.expiry.check.cron=0 0 2 * * ?

spring.task.scheduling.pool.size=5

# =========================
# OAUTH2 GOOGLE
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-name=Library Management App
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub